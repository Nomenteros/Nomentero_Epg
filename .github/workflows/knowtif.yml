# Knowtif - GitHub Notifications
# Docs: https://github.com/NagusameCS/knowtif

name: Knowtif

on:
  push:
    branches: [ "main", "master" ]
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.name != 'Knowtif' || github.event_name != 'workflow_run' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx knowtif@latest action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: "toni700@gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ""
          SMTP_PASS: ""
          EMAIL_TO: ""
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: "toni700@gmail.com"
          SMTP_PASS: "oigv ihnm qcbm gxcx"
          EMAIL_TO: "toni700@gmail.com"
